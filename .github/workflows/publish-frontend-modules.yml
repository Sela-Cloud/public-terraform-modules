name: Validate and Publish Frontend Modules

on:
  # No `push: tags`. Every release now goes through release.yml, which bumps the wrappers on main,
  # places the tag on that commit, and then calls this. Running on the tag push itself would
  # validate the tag where the Releases button first put it — before the bump — and fail, which is
  # what v0.8.0 and v0.8.1 did.
  workflow_dispatch:
    inputs:
      release_ref:
        description: "An EXISTING tag to re-publish, e.g. v0.7.9. To cut a new release, run the Release workflow instead."
        required: true
        type: string
      full_upload:
        description: "Upload every module's metadata, not only what changed since the release the bucket holds. Use to repair the bucket."
        required: false
        type: boolean
        default: false
  # Called by release.yml after it pushes the tag. That push is made with GITHUB_TOKEN, which
  # GitHub deliberately does not let trigger `push: tags` above — so without this, a release cut
  # by the workflow would never be published.
  workflow_call:
    inputs:
      release_ref:
        description: "Release tag to validate and publish"
        required: true
        type: string
      full_upload:
        description: "Upload every module's metadata, not only what changed since the release the bucket holds."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-frontend-modules
  cancel-in-progress: false

env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  GCS_PREFIX: ${{ vars.GCS_PREFIX }}

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release reference
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release reference must be a version tag such as v0.3 or v0.3.0."
            exit 1
          fi

      # This workflow publishes a tag; it never creates one. Run by hand with a version that has not
      # been released yet, checkout otherwise fails three times with a bare `git fetch` exit code and
      # a retry loop — naming neither the tag nor the workflow that would have created it.
      - name: Check the tag exists
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_REF}" --silent 2>/dev/null; then
            echo "::error::${RELEASE_REF} is not a tag. This workflow re-publishes an existing release; to create ${RELEASE_REF}, run the Release workflow."
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          # History and tags, to find the previous release and what changed since it.
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate metadata JSON
        shell: bash
        run: |
          jq empty frontend/ui-metadata.schema.json
          find frontend/modules -name ui-metadata.json -print0 | xargs -0 -n1 jq empty

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same checks as the validate-frontend-modules workflow, repeated here so a release
      # can never publish a catalog that fails them -- in particular, one that violates
      # the very schema published next to it.
      - name: Validate metadata against ui-metadata.schema.json
        shell: bash
        run: |
          pip install jsonschema
          python3 frontend/validate_schema.py

      # --expect-ref: every wrapper must pin *this* tag, not merely one uniform tag that exists.
      # Uniform-and-existing is what a hand-made tag passes — cut on a commit whose wrappers still
      # pin the previous release — and it then fails deep inside `terraform init` below, on
      # whichever wrapper first uses an argument the old child module lacks.
      - name: Validate catalog metadata against Terraform
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: python3 frontend/validate_metadata.py --ref-mode release --expect-ref "${RELEASE_REF}"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive frontend/modules

      # Compared with the last release that completed, not merely the last tag: see the script.
      - name: Find the previous release
        id: previous
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: |
          previous="$(python3 .github/scripts/previous_release.py "${RELEASE_REF}" HEAD)"
          echo "tag=${previous}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${previous}" ]]; then
            echo "::notice::Validating module templates changed since ${previous}."
          else
            echo "::notice::No completed release before ${RELEASE_REF}; validating every module template."
          fi

      # As written, against the tag's own remote refs. Only wrappers changed since the previous
      # release, and every wrapper whose child module changed; the release bump touches every
      # wrapper's pin, but pin-only edits do not count as changes.
      - name: Initialize and validate module templates
        shell: bash
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          if [[ -n "${PREVIOUS}" ]]; then
            # Captured first: inside `< <(...)` a failing selection would be ignored and validate
            # nothing, where an assignment fails the step.
            selected="$(python3 .github/scripts/validate_terraform.py --changed-since "${PREVIOUS}" --list)"
            mapfile -t module_dirs < <(grep '^frontend/modules/' <<< "${selected}" || true)
          else
            # Keyed off the marker file rather than a fixed depth: a catalog entry may sit at
            # frontend/modules/<id> or frontend/modules/<provider>/<id>, and a provider directory
            # is not itself a Terraform module.
            mapfile -t module_dirs < <(
              find frontend/modules \
                -type d -name .terraform -prune -o \
                -type f -name ui-metadata.json -printf '%h\n' | sort
            )
          fi
          if [[ ${#module_dirs[@]} -eq 0 ]]; then
            echo "No module templates changed since ${PREVIOUS}; nothing to validate."
          fi
          for module_dir in "${module_dirs[@]}"; do
            echo "::group::${module_dir}"
            terraform -chdir="${module_dir}" init -backend=false -input=false
            terraform -chdir="${module_dir}" validate
            echo "::endgroup::"
          done

      - name: Validate publication settings
        shell: bash
        run: |
          test -n "${GCS_BUCKET}"
          test -n "${GCS_PREFIX}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Only the metadata that changed since the release the bucket already holds — recorded in the
      # bucket itself by the last successful publish, not taken from git. The previous tag is not
      # the same thing: a release whose publish failed never reached the bucket, and diffing from
      # its tag would skip its changes for good. Everything is uploaded when that record is missing
      # (the first publish), unusable, or not an ancestor of this release (re-publishing an older
      # tag, a rollback), or when full_upload is set. Nothing is ever deleted from the bucket.
      - name: Publish frontend module catalog metadata
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
          FULL_UPLOAD: ${{ inputs.full_upload }}
        run: |
          base_url="gs://${GCS_BUCKET}/${GCS_PREFIX}"
          marker="${base_url}/published-release.txt"
          published="$(gcloud storage cat "${marker}" 2>/dev/null | tr -d '[:space:]' || true)"

          full=true
          if [[ "${FULL_UPLOAD}" == "true" ]]; then
            reason="a full upload was requested"
          elif [[ -z "${published}" ]]; then
            reason="the bucket has no record of a published release"
          elif [[ ! "${published}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || ! git rev-parse --quiet --verify "refs/tags/${published}" >/dev/null; then
            reason="the bucket records '${published}', which is not a release tag of this repository"
          elif ! git merge-base --is-ancestor "refs/tags/${published}" HEAD; then
            reason="the bucket holds ${published}, which ${RELEASE_REF} does not build on"
          else
            full=false
          fi

          if [[ "${full}" == "true" ]]; then
            echo "::notice::Uploading every module's metadata: ${reason}."
            mapfile -t files < <(
              find frontend/modules \
                -type d -name .terraform -prune -o \
                -type f -name ui-metadata.json -print | sort
            )
            files=("frontend/ui-metadata.schema.json" "${files[@]}")
          else
            echo "::notice::Uploading metadata changed since ${published}, the release the bucket holds."
            # Added, modified, or renamed; a deleted module's metadata stays in the bucket, as it
            # always has.
            mapfile -t files < <(
              git diff --name-only --diff-filter=AMR "refs/tags/${published}" HEAD -- \
                frontend/ui-metadata.schema.json \
                ':(glob)frontend/modules/**/ui-metadata.json'
            )
          fi

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metadata changed since ${published}; nothing to upload."
          fi
          for metadata_file in "${files[@]}"; do
            relative_path="${metadata_file#frontend/}"
            gcloud storage cp "${metadata_file}" "${base_url}/${relative_path}"
            echo "- \`${relative_path}\`" >> "${GITHUB_STEP_SUMMARY}"
          done

          # Last, so a publish that failed part-way leaves the old record and the next one retries
          # everything since then.
          printf '%s\n' "${RELEASE_REF}" | gcloud storage cp - "${marker}"
          echo "Uploaded ${#files[@]} file(s); the bucket now holds ${RELEASE_REF}."
