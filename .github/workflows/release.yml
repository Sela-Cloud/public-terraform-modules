name: Release

# Cut a release: pin every wrapper at the release tag, validate, commit to main, point the tag at
# that commit — then publish.
#
# Two ways in, one result:
#
#   GitHub Releases → "Draft a new release" → publish it
#       The usual way. GitHub creates the tag on main's current commit; this workflow then bumps
#       the pins, commits, and MOVES the tag onto the bump commit.
#
#   Actions → Release → Run workflow → version
#       The tag does not exist yet; this workflow bumps, commits, and CREATES it. Has a dry run.
#
# ── Why the tag must end up on the bump commit ─────────────────────────────────
# Wrappers reach their child modules by `?ref=` of this repo, and publish only uploads the form
# (ui-metadata.json) — the Terraform that deploys is read from main. So the pins have to be bumped
# *on main*, and the tag has to point at that commit. A tag left where the Releases button put it
# carries wrappers pinning the previous release; publish refuses it, and if it did not, the new
# form would go live while every deploy used the old child module. That is what happened to
# v0.8.0 and v0.8.1, both cut with the button before this workflow listened for it.
#
# ── Moving a tag ──────────────────────────────────────────────────────────────
# Moving a tag is normally wrong: anyone who fetched it keeps the old one. It is safe here only
# because it happens within the minute the tag was created, before anything consumed it — publish
# no longer runs on tag pushes, so nothing else reads the tag in between. If GitHub's "immutable
# releases" setting is ever enabled, the move is refused and releases must be cut from the Actions
# tab instead.
#
# ── Why publish is called, not triggered ──────────────────────────────────────
# GitHub does not start workflows from events the default GITHUB_TOKEN creates, so the tag pushed
# here would not trigger publish. It is invoked directly instead.
#
# ── Branch protection ─────────────────────────────────────────────────────────
# This pushes one commit straight to main. If main requires pull requests, grant the Actions bot a
# bypass or the push step fails — cleanly, after validation and before any tag is created or moved.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.8.2"
        required: true
        type: string
      dry_run:
        description: "Bump and validate only — commit, tag and publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # For the publish workflow's Google Cloud authentication, which it inherits from this caller.
  id-token: write

concurrency:
  # One release at a time, and never cancelled halfway: a release interrupted between pushing the
  # commit and placing the tag leaves main bumped with no tag to match.
  group: release
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.15.8"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dry_run: ${{ steps.check.outputs.dry_run }}

    steps:
      - name: Check the request
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [[ "${EVENT}" == "release" ]]; then
            VERSION="${RELEASE_TAG}"
            DRY_RUN=false
          else
            VERSION="${INPUT_VERSION}"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
            # A release is cut from main: it is what deploys use, and what the bump lands on.
            if [[ "${REF}" != "refs/heads/main" ]]; then
              echo "::error::Run this from main, not ${REF}."
              exit 1
            fi
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a release version like v0.8.2."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${DRY_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # From the Actions tab the tag must not exist yet — releases are immutable. From the Releases
      # button it exists by construction, and must sit on main: the bump lands on main, and moving a
      # tag off a commit someone deliberately chose elsewhere would change what they released.
      - name: Check the tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git fetch --quiet --tags --force origin
          if [[ "${EVENT}" == "release" ]]; then
            if ! git merge-base --is-ancestor "refs/tags/${VERSION}" origin/main; then
              echo "::error::${VERSION} points at a commit that is not on main. Create the release from main."
              exit 1
            fi
            # Tagged, then more merged before this ran: say what the release will also contain.
            extra="$(git log --oneline "refs/tags/${VERSION}..origin/main")"
            if [[ -n "${extra}" ]]; then
              echo "::notice::main moved after ${VERSION} was created; the release will also include:"
              echo "${extra}"
            fi
          elif git rev-parse --quiet --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::${VERSION} already exists. Releases are immutable — pick the next version."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin every wrapper at ${{ steps.check.outputs.version }}
        run: python3 .github/scripts/bump_refs.py "${{ steps.check.outputs.version }}"

      # The same checks a PR gets, now against the tree the tag will contain — and with the
      # strictest ref rule: every pin is exactly this version.
      - name: Check module layout
        run: python3 .github/scripts/check_module_layout.py

      - name: Validate metadata
        shell: bash
        run: |
          pip install jsonschema
          python3 frontend/validate_schema.py
          python3 frontend/validate_metadata.py --ref-mode release \
            --expect-ref "${{ steps.check.outputs.version }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive frontend/modules modules

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('**/versions.tf') }}
          restore-keys: terraform-providers-${{ env.TERRAFORM_VERSION }}-

      # Every module, against the local tree: what matters is that the code going into the tag
      # agrees with itself.
      - name: Validate every module
        shell: bash
        run: |
          export TF_PLUGIN_CACHE_DIR="${HOME}/.terraform.d/plugin-cache"
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          python3 .github/scripts/validate_terraform.py

      - name: Show the bump
        run: git --no-pager diff --stat

      - name: Commit, push, and place the tag
        if: ${{ steps.check.outputs.dry_run != 'true' }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.check.outputs.version }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing to commit is fine — the pins were already bumped. The tag still goes on main's
          # current commit, which then carries wrappers pinning it.
          if ! git diff --quiet; then
            git commit -am "Release ${VERSION}: pin wrappers to ${VERSION}"
          fi

          # Main before the tag, always. If main has moved since checkout this push is rejected and
          # no tag is created or moved — re-run the workflow.
          git push origin HEAD:main

          if [[ "${EVENT}" == "release" ]]; then
            # Move the tag the Releases button created onto the bump commit. See "Moving a tag"
            # above for why this is safe here and nowhere else.
            git tag --force -a "${VERSION}" -m "Release ${VERSION} (created by ${ACTOR})"
            git push --force origin "refs/tags/${VERSION}"
          else
            git tag -a "${VERSION}" -m "Release ${VERSION} (cut by ${ACTOR})"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Dry run
        if: ${{ steps.check.outputs.dry_run == 'true' }}
        run: |
          echo "::notice::Dry run — ${{ steps.check.outputs.version }} validated. Nothing was committed, tagged or published."

  publish:
    needs: prepare
    if: ${{ needs.prepare.outputs.dry_run != 'true' }}
    uses: ./.github/workflows/publish-frontend-modules.yml
    with:
      release_ref: ${{ needs.prepare.outputs.version }}
    secrets: inherit
